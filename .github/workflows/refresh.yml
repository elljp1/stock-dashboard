name: Refresh dashboard
on:
  schedule:
    # GitHub's scheduler is best-effort and drops on-the-hour/half-hour slots
    # most (they are the most congested) - on 8/27 all three pre-market runs
    # were silently skipped. Odd minutes + double density = a miss costs 30
    # minutes of staleness instead of a whole morning.
    - cron: "17 10-21 * * 1-5"  # 6:17 AM - 5:17 PM ET, hourly
    - cron: "47 11-20 * * 1-5"  # 7:47 AM - 4:47 PM ET, half-hour offsets
    - cron: "17 23 * * 1-5"     # 7:17 PM ET  evening
  workflow_dispatch: {}
  # run on manual pushes too, so a pushed fix is verified immediately instead
  # of waiting for the next cron. The workflow's own bot commits use the
  # default GITHUB_TOKEN, whose pushes never re-trigger workflows - no loop.
  push:
    branches: [main]

permissions:
  contents: write

# only one refresh at a time - overlapping runs caused racing Pages deploys
# that cancelled each other and left the live site stale
concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas numpy ephem esprima
      - run: python fetch_data.py
      - run: python backfill.py
      - run: python benchmark.py
      - run: python astro_lab.py
      - run: python analyze.py
      - run: python coherence_check.py
      - run: python anomaly_audit.py
      # runtime smoke test: load the built page in jsdom and prove it boots
      # (esprima only catches syntax errors; this catches the runtime crashes
      # that have twice broken the live page)
      - run: npm install --no-save jsdom
      - run: node smoke_test.js
      - name: Commit and push updated dashboard
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html dashboard_single.html data.js predictions_log.json daily_extremes.json trades.json trades_log.json horizons_log.json real_trades.json improvements_log.md backfill.json benchmark.json week_plan.json week_plan_log.json revisions_log.json astro_lab.json
          git commit -m "auto refresh (cloud)" || echo "nothing new"
          git push

