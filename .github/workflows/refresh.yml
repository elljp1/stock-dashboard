name: Refresh dashboard
on:
  schedule:
    # Exact Eastern cadence. GitHub cron is UTC, so both daylight and standard
    # time schedules are registered; the gate below runs only the active one.
    # Weekdays ET: 06:00, 07:00, 08:00, 09:00, 09:15, 09:20, 09:25,
    # 09:30, 09:35, 09:45, 10:00, then every 30 minutes through 17:00.
    - cron: "0 10-21 * * 1-5"          # EDT whole hours, 06:00-17:00 ET
    - cron: "30 13-20 * * 1-5"         # EDT 09:30, then :30 through 16:30 ET
    - cron: "15,20,25,35,45 13 * * 1-5" # EDT market-open sequence
    - cron: "0 11-22 * * 1-5"          # EST whole hours, 06:00-17:00 ET
    - cron: "30 14-21 * * 1-5"         # EST 09:30, then :30 through 16:30 ET
    - cron: "15,20,25,35,45 14 * * 1-5" # EST market-open sequence
    - cron: "0 22 * * *"               # EDT daily review, 18:00 ET
    - cron: "0 23 * * *"               # EST daily review, 18:00 ET
    - cron: "7,22,37,52 10-23 * * *"    # missed-refresh watchdog, away from hour boundaries
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dashboard-refresh
  cancel-in-progress: false
jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        name: Select the active Eastern-time schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SCHEDULE" = "7,22,37,52 10-23 * * *" ]; then
            python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/New_York'))
          slots = [18*60]
          if now.weekday() < 5:
              slots += [360,420,480,540,555,560,565,570,575,585]
              slots += list(range(600,1021,30))
          due = [now.replace(hour=m//60, minute=m%60, second=0, microsecond=0)
                 for m in slots if m <= now.hour*60+now.minute-10]
          should_run = False
          if due and 6 <= now.hour <= 18:
              try:
                  url = 'https://raw.githubusercontent.com/elljp1/stock-dashboard/main/daily_review.json'
                  req = urllib.request.Request(url, headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      reviewed = datetime.fromisoformat(json.load(response)['reviewedAt'])
                  should_run = reviewed < max(due)
              except Exception as error:
                  print('Freshness check unavailable; attempting recovery:', error)
                  should_run = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('should_run=' + str(should_run).lower() + '\n')
          print('Missed-refresh recovery needed:', should_run)
          PY
            exit 0
          fi
          case "$SCHEDULE" in
            "0 10-21 * * 1-5"|"30 13-20 * * 1-5"|"15,20,25,35,45 13 * * 1-5"|"0 22 * * *") expected="-0400" ;;
            "0 11-22 * * 1-5"|"30 14-21 * * 1-5"|"15,20,25,35,45 14 * * 1-5"|"0 23 * * *") expected="-0500" ;;
            *) expected="invalid" ;;
          esac
          actual="$(TZ=America/New_York date +%z)"
          if [ "$actual" = "$expected" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Inactive DST twin skipped ($SCHEDULE; Eastern offset $actual)."
          fi
  refresh:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: https://elljp1.github.io/stock-dashboard/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install --quiet pandas numpy ephem esprima
      - name: Download complete data with retry
        run: |
          for attempt in 1 2 3; do
            if python fetch_data.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - run: python backfill.py
      - run: python benchmark.py
      - run: python astro_lab.py || echo "::warning::Astro enrichment unavailable; retaining previous lab"
      - run: python analyze.py
      - run: python reliability.py
      - run: python coherence_check.py
      - run: python anomaly_audit.py
      - run: npm ci --ignore-scripts
      - run: node smoke_test.js
      - run: node reliability_test.js
      - run: python -m unittest test_reliability.py test_scoring.py
      - name: Publish only validated artifacts
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html dashboard_single.html data.js predictions_log.json daily_extremes.json trades.json trades_log.json horizons_log.json real_trades.json improvements_log.md backfill.json benchmark.json week_plan.json week_plan_log.json revisions_log.json astro_lab.json forecast_ledger.json daily_review.json
          if ! git diff --cached --quiet; then git commit -m "auto refresh and review (cloud)"; fi
          # Never resolve code/data races by discarding another writer's work.
          # A conflicting update fails visibly; the next scheduled run rebuilds.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
              echo "::error::Repository changed during analysis; next scheduled run must rebuild"
              exit 1
            fi
          done
          exit 1
      - name: Package last validated site
        run: |
          mkdir -p public-site
          cp index.html dashboard_single.html data.js daily_review.json public-site/
          touch public-site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - uses: actions/deploy-pages@v4
      - name: Report failure
        if: failure()
        run: echo "::error::Refresh or deployment failed. Previous publication remains available; next scheduled run retries. Inspect this run before treating data as current."
