name: Refresh dashboard
on:
  schedule:
    # hourly during US market hours, 9:30 AM - 4:30 PM Eastern (summer time)
    - cron: "30 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas numpy ephem
      - run: python fetch_data.py
      - run: python analyze.py
      - run: python coherence_check.py
      - name: Commit and push updated dashboard
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html dashboard_single.html data.js predictions_log.json daily_extremes.json trades.json trades_log.json horizons_log.json real_trades.json improvements_log.md
          git commit -m "auto refresh (cloud)" || echo "nothing new"
          git push

