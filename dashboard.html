<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock High/Low</title>
<script src="data.js"></script>
<style>
  :root{--bg:#f6f8fa; --panel:#fff; --border:#d0d7de; --text:#1f2328; --dim:#57606a;
    --green:#1a7f37; --red:#cf222e; --amber:#9a6700; --blue:#0969da; --accent:#8250df; --pad:16px}
  @media(max-width:700px){:root{--pad:6px}}
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{padding:var(--pad); max-width:1100px; margin:0 auto}
  #glance{display:flex; flex-direction:column; gap:6px; height:calc(100vh - 2*var(--pad)); height:calc(100svh - 2*var(--pad)); max-height:900px}
  #gTop{display:flex; align-items:center; gap:6px}
  #gTicker{font:700 15px system-ui,-apple-system,sans-serif; padding:6px 4px; border:1px solid var(--border);
    border-radius:8px; background:var(--panel); color:var(--text); min-width:0; flex:1 1 auto; max-width:190px}
  #gPeriod{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden}
  #gPeriod button{font:700 13px system-ui,-apple-system,sans-serif; width:34px; padding:7px 0; border:0;
    background:var(--panel); color:var(--dim); cursor:pointer}
  #gPeriod button.on{background:var(--blue); color:#fff}
  #gUpd{font:600 12px system-ui,-apple-system,sans-serif; padding:7px 8px; border:1px solid var(--border); border-radius:8px;
    background:var(--panel); color:var(--dim); cursor:pointer; white-space:nowrap; margin-left:auto}
  #gUpd .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:4px; vertical-align:1px}
  #gUpd.old .dot{background:var(--amber)} #gUpd.bad .dot{background:var(--red)}
  #gChartWrap{flex:1 1 auto; min-height:140px; background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden}
  #chart{display:block; width:100%; height:100%; touch-action:pan-y}
  #gRes{display:grid; grid-template-columns:auto 1fr auto; column-gap:10px; row-gap:1px; align-items:baseline;
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:7px 12px; font-variant-numeric:tabular-nums}
  #gRes .lbl{font-weight:700; font-size:13px; color:var(--dim)}
  #gRes .val{font-weight:800; font-size:21px}
  #gRes .val small,#gRes .when small{font-weight:600; font-size:12px; color:var(--dim); margin-left:5px; white-space:nowrap}
  #gRes .when small{margin-left:0}
  #gRes .when{font-weight:700; font-size:15px; text-align:right}
  #gRes .hi{color:var(--green)} #gRes .lo{color:var(--red)}
  #gMeta{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:var(--dim)}
  #gMeta b{color:var(--red)}
  #gHist summary{cursor:pointer; list-style:none; font-weight:600; color:var(--blue); white-space:nowrap}
  #gHist summary::-webkit-details-marker{display:none}
  #gHistBody{position:fixed; inset:8% 3% 3% 3%; z-index:60; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; padding:12px; overflow:auto; box-shadow:0 8px 30px rgba(0,0,0,.25)}
  #gHistBody table{border-collapse:collapse; width:100%; font-size:12px; font-variant-numeric:tabular-nums}
  #gHistBody th,#gHistBody td{padding:4px 6px; border-bottom:1px solid #eaeef2; text-align:left}
  #gHistBody button{float:right; font-size:14px; border:1px solid var(--border); background:var(--panel); border-radius:6px; padding:2px 10px}
  #chartTooltip{position:fixed; z-index:1000; pointer-events:none; white-space:pre-line; background:#14233b; color:#fff;
    padding:8px 12px; border-radius:8px; font-size:13px; line-height:1.45; display:none; max-width:240px}
</style>
</head>
<body>
<!-- PIN gate: keeps casual visitors out. The page is still a public static
     site, so this is a privacy curtain, not bank-grade security. -->
<div id="pinGate" style="position:fixed; inset:0; z-index:99999; background:#f7f8fa;
     display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px">
  <div style="font-size:22px; font-weight:700; color:#1a1a2e">Stock Timing Dashboard</div>
  <div style="color:#667; font-size:14px">Enter PIN to continue</div>
  <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" autofocus aria-label="PIN"
         style="font-size:26px; letter-spacing:10px; text-align:center; width:170px; padding:10px;
                border:2px solid #c9d2e0; border-radius:10px" />
  <button id="pinGo" style="font-size:16px; padding:10px 34px; border:0; border-radius:10px;
          background:#2563eb; color:#fff; font-weight:600; cursor:pointer">Unlock</button>
  <div id="pinMsg" style="color:#c0392b; font-size:13px; min-height:18px"></div>
</div>
<script>
(function(){
  var GATE_H = "2810766e5bc11ad77d69d4d28fe5cf6b8033c67e2e6ec2237b029f6855436885";
  var DAYS = 30;
  function sha256(str){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){
        return ("0" + b.toString(16)).slice(-2);
      }).join("");
    });
  }
  function open_(){ var g = document.getElementById("pinGate"); if(g) g.remove(); }
  // This script runs before the dashboard's storage helper is initialized.
  // Read both stores directly so reloads restore a successful unlock.
  var stores = ["localStorage", "sessionStorage"];
  var remembered = stores.some(function(name){
    try {
      var saved = JSON.parse(window[name].getItem("pinOk") || "null");
      var age = saved && Date.now() - saved.t;
      return saved && saved.h === GATE_H && Number.isFinite(saved.t) &&
        age >= 0 && age < DAYS*864e5;
    } catch(e){ return false; }
  });
  if(remembered){ open_(); return; }
  var attempt = 0;
  function tryPin(explicit){
    var field = document.getElementById("pinIn");
    if(!field) return;
    var v = (field.value || "").trim(), current = ++attempt;
    if(!v) return;
    sha256("stk-dash-2026|" + v).then(function(h){
      // An earlier hash must not clear or unlock a newer input.
      if(current !== attempt || !field.isConnected || field.value.trim() !== v) return;
      if (h === GATE_H){
        stores.forEach(function(name){
          try { window[name].setItem("pinOk", JSON.stringify({h:h, t:Date.now()})); } catch(e){}
        });
        open_();
      } else if(explicit) {
        document.getElementById("pinMsg").textContent = "Wrong PIN";
        field.value = "";
        field.focus({preventScroll:true});
      }
    }).catch(function(){
      if(current === attempt && field.isConnected)
        document.getElementById("pinMsg").textContent = "PIN verification unavailable. Please reload and try again.";
    });
  }
  document.getElementById("pinGo").addEventListener("click", function(){tryPin(true);});
  document.getElementById("pinIn").addEventListener("input", function(){
    document.getElementById("pinMsg").textContent = "";
    tryPin(false);
  });
  document.getElementById("pinIn").addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); tryPin(true); }
  });
  function focusPin(){
    var i = document.getElementById("pinIn");
    if(i && document.activeElement !== document.getElementById("pinGo"))
      i.focus({preventScroll:true});
  }
  focusPin();
  document.addEventListener("DOMContentLoaded", focusPin, {once:true});
  requestAnimationFrame(focusPin);
  window.addEventListener("load", focusPin, {once:true});
  window.addEventListener("pageshow", focusPin);
  window.addEventListener("focus", focusPin);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) focusPin();
  });
  // If browser focus lands on the page, typing digits still enters the PIN.
  document.addEventListener("keydown", function(e){
    var field = document.getElementById("pinIn");
    if(!field || e.target === field || e.ctrlKey || e.metaKey || e.altKey ||
       e.isComposing || !/^[0-9]$/.test(e.key)) return;
    e.preventDefault();
    field.focus({preventScroll:true});
    if(field.value.length < field.maxLength){
      field.setRangeText(e.key, field.selectionStart, field.selectionEnd, "end");
      field.dispatchEvent(new Event("input", {bubbles:true}));
    }
  });
  // Mobile browsers may require a gesture to open the keyboard. Tapping the
  // gate background also focuses the field, without targeting the small box.
  document.getElementById("pinGate").addEventListener("click", function(e){
    if(e.target !== document.getElementById("pinGo")) focusPin();
  });
})();
</script>

<div id="glance">
  <div id="gTop">
    <select id="gTicker" aria-label="Stock"></select>
    <div id="gPeriod" role="group" aria-label="Period"><button data-p="D">D</button><button data-p="W">W</button><button data-p="M">M</button><button data-p="Y">Y</button></div>
    <button id="gUpd" title="Update"><span class="dot"></span><span id="gUpdTime">update</span></button>
  </div>
  <div id="gChartWrap"><canvas id="chart" aria-label="Price chart with forecast high and low" tabindex="0"></canvas></div>
  <div id="gRes"></div>
  <div id="gMeta"><span id="gAsOf"></span>
    <details id="gHist"><summary>&#9656; History</summary><div id="gHistBody"></div></details></div>
</div>
<div id="chartTooltip" role="status"></div>
<script>
/* Stock High/Low: one screen with the chart and the high/low results.
   The chart and the result rows are both drawn from periodView(), so they always
   show the same forecast points; actual (already traded) extremes are marked apart. */
const safeStorage = {
  getItem(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  setItem(k,v){try{localStorage.setItem(k,v);}catch(e){}}
};
const $ = id => document.getElementById(id);
const fmt$ = v => "$" + Number(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const NICE = {"GC=F": "GOLD"};
const nice = t => NICE[t] || t;
const PERIODS = ["D","W","M","Y"];
let TICKERS = Object.keys(DATA_ALL);
let CUR = safeStorage.getItem("tkr"); if(!TICKERS.includes(CUR)) CUR = TICKERS[0];
let PERIOD = safeStorage.getItem("period"); if(!PERIODS.includes(PERIOD)) PERIOD = "D";
let HILO_LIVE = (typeof HILO === "undefined") ? null : HILO;
let LAST_PULL_FAILED = false;

const dayLbl = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", {weekday:"short", month:"numeric", day:"numeric"});
const md = iso => Number(iso.slice(5,7)) + "/" + Number(iso.slice(8,10));
const t12 = hhmm => { const h = Number(hhmm.slice(0,2)), m = hhmm.slice(3); return ((h % 12) || 12) + ":" + m + (h < 12 ? "a" : "p"); };
const etToday = () => new Date().toLocaleDateString("en-CA", {timeZone:"America/New_York"});

function hiloValid(h){
  if(h === null) return true;
  if(typeof h !== "object" || typeof h.generatedAt !== "string" || isNaN(Date.parse(h.generatedAt))) return false;
  if(h.failed) return typeof h.failed === "object";
  if(typeof h.targetSession !== "string" || !h.latest || typeof h.latest !== "object") return false;
  return Object.values(h.latest).every(slot => slot && Object.values(slot).every(r => r && ["high","low"].every(sd =>
    r[sd] && [r[sd].price, r[sd].lo, r[sd].hi].every(v => Number.isFinite(v) && v > 0) && typeof r[sd].time === "string")));
}
function hiloRec(t){
  const H = HILO_LIVE;
  if(!H || H.failed) return null;
  const slot = (H.latest || {})[t] || {};
  return slot.intraday || slot.premarket || null;
}

/* the single source for chart and results */
function periodView(D, per){
  const rec = hiloRec(D.ticker);
  if(!rec) return {rec:null, per:per, fc:[]};
  const S = rec.session;
  const ps = ((HILO_LIVE.periods || {})[D.ticker] || {})[per] || null;
  const span = per === "D" ? [S, S] : (ps ? [ps.start, ps.end] : [S, S]);
  const resolved = !!(rec.timing && rec.timing.resolved);
  const fc = ["high","low"].map(side => ({src:"day", type:side, date:S, price:rec[side].price, lo:rec[side].lo,
    hi:rec[side].hi, time: resolved ? rec[side].time : null}));
  if(per !== "D"){
    (D.predictions || []).filter(p => p.isoDate > S).slice(0, 5)
      .filter(p => p.isoDate <= span[1])
      .forEach(p => fc.push({src:"turn", type:p.type, date:p.isoDate, price:p.price}));
  }
  const best = (type, better) => fc.filter(p => p.type === type).reduce((a, b) => (!a || better(b.price, a.price)) ? b : a, null);
  return {rec:rec, per:per, S:S, span:span, fc:fc, timing:rec.timing || null, resolved:resolved,
          high:best("high", (x, y) => x > y), low:best("low", (x, y) => x < y),
          actual: per === "D" ? null : (ps ? {high:ps.high, low:ps.low} : null)};
}

// Text drawn on the chart next to each prediction. Day view: price and time; when the high/low order is
// unresolved the time is the honest two-bar window with "?", never one exact time per side.
// Other views: price and date (a turn's date is its forecast time; its intraday time is not modelled).
function chartLabels(v){
  if(!v.rec) return [];
  let when = "—";
  if(v.timing && v.timing.consistent !== false){
    const e = t12(v.timing.early.time), l = t12(v.timing.late.time);
    when = e === l ? "≈" + e : e + "/" + l + "?";
  }
  return v.fc.map(p => ({point:p, main:p === v.high || p === v.low,
    text: fmt$(p.price) + " " + (v.per === "D" ? (p.time ? t12(p.time) : when) : md(p.date))}));
}

function renderResults(v){
  const box = $("gRes");
  if(!v.rec){
    const H = HILO_LIVE;
    box.innerHTML = `<span class="lbl">&nbsp;</span><span class="val"><small>${H && H.failed ? "Forecast unavailable" : "No forecast yet"}</small></span><span></span>`;
    return;
  }
  const rows = [];
  for(const side of ["high","low"]){
    const f = v[side], cls = side === "high" ? "hi" : "lo", name = side === "high" ? "High" : "Low";
    let val, when = "";
    if(v.per === "D"){
      val = `${fmt$(f.price)}<small>${Math.round(f.lo)}–${Math.round(f.hi)}</small>`;
      when = f.time ? t12(f.time) : "";
    } else {
      val = `${fmt$(f.price)}<small>proj. pt ${esc(md(f.date))}</small>`;
      const a = v.actual && v.actual[side];
      when = a ? `<small>so far</small> ${fmt$(a.price)} <small>${md(a.date)}</small>` : "";
    }
    rows.push(`<span class="lbl">${name}</span><span class="val ${cls}" data-side="${side}" data-price="${f.price}">${val}</span><span class="when">${when}</span>`);
  }
  if(v.per === "D" && v.timing && !v.resolved){
    const e = v.timing.early.time, l = v.timing.late.time;
    const txt = v.timing.consistent === false ? "times unclear"
      : (e === l ? `both ≈${t12(e)}` : `1st ≈${t12(e)} · 2nd ≈${t12(l)}`);
    rows.push(`<span class="lbl">Time</span><span class="when" style="text-align:left">${txt}</span><span class="when"><small>${e === l || v.timing.consistent === false ? "" : "order ?"}</small></span>`);
  }
  box.innerHTML = rows.join("");
}

function renderMeta(v){
  const H = HILO_LIVE, el = $("gAsOf");
  if(!H){ el.textContent = "forecast pending"; return; }
  if(H.failed){ el.innerHTML = `<b>forecast unavailable</b>`; return; }
  if(!v.rec){ el.textContent = nice(CUR) + ": " + (((H.notes || {})[CUR]) || "no forecast"); return; }
  const stale = v.S < etToday();
  const cut = new Date(v.rec.dataCutoff).toLocaleString("en-US", {timeZone:"America/New_York", weekday:"short", hour:"numeric", minute:"2-digit"}).replace(" AM","a").replace(" PM","p");
  const span = v.per === "D" ? dayLbl(v.S) : md(v.span[0]) + "–" + md(v.span[1]);
  const nt = v.fc.filter(p => p.src === "turn").length;
  const part = v.per === "D" ? "" : ` · partial: day + ${nt} turn${nt === 1 ? "" : "s"}`;
  el.innerHTML = `${esc(span)}${part} · ${v.rec.kind === "intraday" ? "live" : "premarket"} · data ${esc(cut)}` + (stale ? ` · <b>stale</b>` : "") + (v.per === "D" ? " · 80% range" : "");
}

function renderUpd(D){
  const b = $("gUpd"), H = HILO_LIVE;
  const g = H && H.generatedAt ? new Date(H.generatedAt) : null;
  $("gUpdTime").textContent = g ? g.toLocaleTimeString("en-US", {timeZone:"America/New_York", hour:"numeric", minute:"2-digit"}).replace(" AM","a").replace(" PM","p") : "update";
  b.className = LAST_PULL_FAILED ? "bad" : (g && Date.now() - g.getTime() > 3 * 3600e3 ? "old" : "");
  b.title = LAST_PULL_FAILED ? "Last update failed; previous data kept" : "Update";
}

/* ---------- chart ---------- */
function drawChart(D, v){
  const c = $("chart"), wrap = c.parentElement, dpr = window.devicePixelRatio || 1;
  const W = Math.max(260, wrap.clientWidth || 360), H = Math.max(140, wrap.clientHeight || 260);
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  c.__w = W; c.__h = H;
  const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
  const allD = D.chart.dates, allC = D.chart.closes;
  let start = Math.max(0, allD.length - ({D:22, W:30, M:45, Y:250}[v.per] || 30));
  if(v.per === "Y" && v.span){ const i = allD.findIndex(d => d >= v.span[0]); if(i >= 0) start = Math.min(i, allD.length - 30); }
  const dates = allD.slice(start), closes = allC.slice(start);
  const fc = v.fc || [];
  const act = [];
  if(v.actual){ for(const side of ["high","low"]) if(v.actual[side]) act.push({type:side, date:v.actual[side].date, price:v.actual[side].price}); }
  const actIn = act.filter(a => a.date >= dates[0]);
  let lastDate = dates[dates.length - 1];
  for(const p of fc) if(p.date > lastDate) lastDate = p.date;
  if(v.per === "W" && v.span && v.span[1] > lastDate) lastDate = v.span[1];
  const t0 = new Date(dates[0]).getTime(), t1 = Math.max(new Date(lastDate).getTime(), t0 + 864e5);
  const pxs = closes.concat(fc.map(p => p.price), fc.filter(p => p.src === "day").map(p => [p.lo, p.hi]).flat(), actIn.map(a => a.price));
  let pMin = Math.min.apply(null, pxs), pMax = Math.max.apply(null, pxs);
  const padP = (pMax - pMin) * 0.06 || pMax * 0.01; pMin -= padP; pMax += padP;
  const L = 6, R = 52, T = 8, B = 18;
  const X = d => L + (new Date(d).getTime() - t0) / (t1 - t0) * (W - L - R);
  const Y = p => T + (1 - (p - pMin) / (pMax - pMin)) * (H - T - B);
  x.font = "600 11px system-ui,sans-serif"; x.textAlign = "left"; x.fillStyle = "#57606a";
  for(let g = 0; g <= 3; g++){
    const p = pMin + g * (pMax - pMin) / 3, y = Y(p);
    x.strokeStyle = "#eef1f4"; x.beginPath(); x.moveTo(L, y); x.lineTo(W - R, y); x.stroke();
    x.fillText("$" + (p < 100 ? p.toFixed(2) : Math.round(p).toLocaleString()), W - R + 4, y + 4);
  }
  if(v.span && v.per !== "D"){                                  // the selected period, lightly shaded
    const a = Math.max(L, X(v.span[0])), b = Math.min(W - R, X(v.span[1]) + 2);
    if(b > a){ x.fillStyle = "rgba(9,105,218,0.06)"; x.fillRect(a, T, b - a, H - T - B); }
  }
  x.textAlign = "center"; x.fillStyle = "#57606a";
  for(const d of [dates[0], dates[Math.floor(dates.length / 2)], lastDate]) x.fillText(md(d), Math.min(Math.max(X(d), L + 16), W - R - 16), H - 4);
  x.strokeStyle = "#0969da"; x.lineWidth = 2; x.lineJoin = "round"; x.beginPath();
  dates.forEach((d, i) => { const px = X(d), py = Y(closes[i]); i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.stroke();
  for(const a of actIn){                                        // already traded: hollow grey
    x.strokeStyle = "#57606a"; x.lineWidth = 2; x.beginPath(); x.arc(X(a.date), Y(a.price), 5, 0, 7); x.stroke();
  }
  const turns = fc.filter(p => p.src === "turn").sort((a, b) => a.date < b.date ? -1 : 1);
  if(turns.length){                                             // next projected turns, purple dashed
    x.strokeStyle = "#8250df"; x.setLineDash([5, 4]); x.lineWidth = 1.4; x.beginPath();
    x.moveTo(X(dates[dates.length - 1]), Y(closes[closes.length - 1]));
    for(const p of turns) x.lineTo(X(p.date), Y(p.price)); x.stroke(); x.setLineDash([]);
  }
  for(const p of fc){
    const px = X(p.date), py = Y(p.price), col = p.type === "high" ? "#1a7f37" : "#cf222e";
    if(p.src === "day"){ x.strokeStyle = col; x.lineWidth = 2; x.beginPath(); x.moveTo(px, Y(p.hi)); x.lineTo(px, Y(p.lo)); x.stroke(); }
    x.fillStyle = col; x.beginPath(); x.arc(px, py, 4.5, 0, 7); x.fill();
  }
  for(const p of [v.high, v.low]){                               // the two numbers in the results: ringed
    if(!p) continue;
    x.strokeStyle = p.type === "high" ? "#1a7f37" : "#cf222e"; x.lineWidth = 1.5;
    x.beginPath(); x.arc(X(p.date), Y(p.price), 8, 0, 7); x.stroke();
  }
  // every prediction labelled on the chart itself; labels never overlap each other
  const labels = chartLabels(v), boxes = [];
  for(let g = 0; g <= 3; g++){ const y = Y(pMin + g * (pMax - pMin) / 3); boxes.push({l:W - R + 2, r:W, t:y - 9, b:y + 6}); }
  for(const p of fc.concat(actIn)){ const px = X(p.date), py = Y(p.price); boxes.push({l:px - 6, r:px + 6, t:py - 6, b:py + 6}); }
  const hit = r => r.l < L || r.r > W - 2 || r.t < T || r.b > H - B || boxes.some(o => r.l < o.r && r.r > o.l && r.t < o.b && r.b > o.t);
  for(const lb of labels){
    const p = lb.point, px = X(p.date), py = Y(p.price), col = p.type === "high" ? "#1a7f37" : "#cf222e";
    x.font = (lb.main ? "700 12px" : "600 11px") + " system-ui,sans-serif";
    const m = x.measureText(lb.text), w = (m && m.width) || lb.text.length * 6.5, h = lb.main ? 14 : 13;
    const up = p.type === "high" ? -1 : 1, cand = [];
    for(const dy of [0, 1, 2, 3, 4, 5, 6]) for(const sx of [-1, 1]) for(const vy of [up, -up])
      cand.push({ax: sx < 0 ? px - 11 - w : px + 11, ay: py + vy * (dy * h) + (vy > 0 ? 4 : -h + 4) + (dy ? 0 : vy * 2)});
    let pick = null;
    for(const cnd of cand){ const r = {l:cnd.ax - 2, r:cnd.ax + w + 2, t:cnd.ay, b:cnd.ay + h}; if(!hit(r)){ pick = r; break; } }
    if(!pick){ const ax = Math.min(Math.max(L, px - w / 2), W - 2 - w); pick = {l:ax - 2, r:ax + w + 2, t:Math.min(Math.max(T, py - h / 2), H - B - h), b:0}; pick.b = pick.t + h; }
    boxes.push(pick);
    const cy = (pick.t + pick.b) / 2;
    const gap = Math.max(pick.l - px, px - pick.r, 0) + Math.max(pick.t - py, py - pick.b, 0);
    if(gap > 14){ x.strokeStyle = col; x.lineWidth = 0.8; x.beginPath(); x.moveTo(px, py); x.lineTo(pick.l < px ? pick.r - 2 : pick.l + 2, cy); x.stroke(); }
    x.textAlign = "left"; x.lineWidth = 3; x.strokeStyle = "rgba(255,255,255,0.9)"; x.lineJoin = "round";
    x.strokeText(lb.text, pick.l + 2, pick.b - 3); x.fillStyle = col; x.fillText(lb.text, pick.l + 2, pick.b - 3);
    lb.box = pick;
  }
  window.__gLabels = labels;
  // hover / tap / keyboard inspection
  const points = dates.map((d, i) => ({date:d, price:closes[i], kind:"Actual daily close"}))
    .concat(fc.map(p => ({date:p.date, price:p.price, kind:(p.src === "day" ? "Forecast " : "Projected turn ") + p.type + (p.time ? " · " + t12(p.time) : "")})))
    .concat(actIn.map(a => ({date:a.date, price:a.price, kind:"Already traded " + a.type + " (period so far)"})));
  const base = document.createElement("canvas"); base.width = c.width; base.height = c.height;
  try { base.getContext("2d").drawImage(c, 0, 0); } catch(e) {}
  const tip = $("chartTooltip"); tip.style.display = "none";
  const restore = () => { try { x.save(); x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,c.width,c.height); x.drawImage(base,0,0); x.restore(); } catch(e) {} };
  const show = (pt, cx, cy) => {
    restore(); x.save(); x.strokeStyle = "#425a78"; x.setLineDash([3,3]); x.beginPath(); x.moveTo(X(pt.date), T); x.lineTo(X(pt.date), H - B); x.stroke(); x.restore();
    tip.textContent = pt.kind + "\n" + pt.date + "\n" + fmt$(pt.price); tip.style.display = "block";
    tip.style.left = Math.max(8, Math.min(cx + 12, window.innerWidth - 250)) + "px"; tip.style.top = Math.max(8, cy - 60) + "px";
  };
  const move = e => {
    const r = c.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width, py = (e.clientY - r.top) * H / r.height;
    const n = points.reduce((a, b) => Math.hypot(X(b.date) - px, Y(b.price) - py) < Math.hypot(X(a.date) - px, Y(a.price) - py) ? b : a);
    show(n, e.clientX, e.clientY);
  };
  c.onpointermove = move; c.onpointerdown = move;
  c.onpointerleave = () => { restore(); tip.style.display = "none"; };
  let k = dates.length - 1;
  c.onkeydown = e => {
    if(e.key === "Escape"){ restore(); tip.style.display = "none"; return; }
    if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); k = Math.max(0, Math.min(dates.length - 1, k + (e.key === "ArrowLeft" ? -1 : 1)));
    const r = c.getBoundingClientRect(); show(points[k], r.left + X(points[k].date) * r.width / W, r.top + Y(points[k].price) * r.height / H);
  };
  window.__gView = v;
}

/* ---------- history (behind the arrow) ---------- */
function renderHistory(){
  const H = HILO_LIVE, rows = ((H && H.history) || []).filter(r => r.ticker === CUR);
  $("gHistBody").innerHTML = `<button type="button" onclick="document.getElementById('gHist').open=false">&times;</button>
    <b>${esc(nice(CUR))}: past forecasts vs actual</b>
    <table><tr><th>Day</th><th></th><th>Fcst</th><th>Actual</th><th>Err</th><th>Time f/a</th></tr>${rows.map(r =>
      `<tr><td>${md(r.session)}</td><td>${r.side === "high" ? "H" : "L"}</td><td>${fmt$(r.pred)}</td><td>${fmt$(r.actual)}</td><td>${esc(r.err)}%</td><td>${esc(r.predTime)}/${esc(r.actualTime)}</td></tr>`).join("")
      || '<tr><td colspan="6">No completed forecast days yet.</td></tr>'}</table>`;
}

/* ---------- render ---------- */
function renderAll(){
  const D = DATA_ALL[CUR];
  const sel = $("gTicker");
  sel.innerHTML = TICKERS.map(t => `<option value="${esc(t)}"${t === CUR ? " selected" : ""}>${esc(nice(t))} ${fmt$(DATA_ALL[t].price)}</option>`).join("");
  document.querySelectorAll("#gPeriod button").forEach(b => b.classList.toggle("on", b.dataset.p === PERIOD));
  const v = periodView(D, PERIOD);
  renderResults(v); renderMeta(v); renderUpd(D);
  drawChart(D, v);
  if($("gHist").open) renderHistory();
}
$("gTicker").onchange = e => { CUR = e.target.value; safeStorage.setItem("tkr", CUR); renderAll(); };
document.querySelectorAll("#gPeriod button").forEach(b => b.onclick = () => { PERIOD = b.dataset.p; safeStorage.setItem("period", PERIOD); renderAll(); });
$("gHist").addEventListener("toggle", () => { if($("gHist").open) renderHistory(); });

/* ---------- update: newest published data, validated, rolled back on failure ---------- */
(function(){
  const RAW = "https://raw.githubusercontent.com/elljp1/stock-dashboard/main/data.js";
  function grab(txt, name){
    const i = txt.indexOf("const " + name + " = ");
    if(i < 0) return {found:false};
    let s = txt.slice(i + name.length + 9).split(String.fromCharCode(10) + "const ")[0].trim();
    if(s.endsWith(";")) s = s.slice(0, -1);
    try { return {found:true, value:JSON.parse(s)}; } catch(e) { return {found:true, bad:true}; }
  }
  function swapIn(txt){
    const d = grab(txt, "DATA_ALL"), fresh = d.value;
    if(!fresh || !Object.keys(fresh).length) throw new Error("no data in response");
    for(const [t, x] of Object.entries(fresh)){
      if(!x || !Number.isFinite(x.price) || x.price <= 0 || !x.chart || !Array.isArray(x.chart.dates) || !x.chart.dates.length ||
         x.chart.dates.length !== (x.chart.closes || []).length || !x.chart.closes.every(c => Number.isFinite(c) && c > 0))
        throw new Error("invalid data for " + t);
    }
    if(TICKERS.some(t => !fresh[t])) throw new Error("incomplete refresh");
    const h = grab(txt, "HILO");
    let nextHilo;
    if(!h.found) nextHilo = {failed:{at:new Date().toISOString(), reason:"no forecasts in refreshed data"}, stale:true, generatedAt:new Date().toISOString()};
    else {
      if(h.bad || !hiloValid(h.value)) throw new Error("forecast data invalid");
      nextHilo = h.value;
      if(nextHilo && HILO_LIVE && !nextHilo.failed && !HILO_LIVE.failed && Date.parse(nextHilo.generatedAt) < Date.parse(HILO_LIVE.generatedAt))
        throw new Error("older forecast rejected");
    }
    const backData = JSON.parse(JSON.stringify(DATA_ALL)), backHilo = HILO_LIVE;
    const assign = (obj, val) => { Object.keys(obj).forEach(k => delete obj[k]); Object.assign(obj, val); };
    try { assign(DATA_ALL, fresh); HILO_LIVE = nextHilo; renderAll(); }
    catch(e) { assign(DATA_ALL, backData); HILO_LIVE = backHilo; renderAll(); throw e; }
  }
  async function pullLatest(){
    const btn = $("gUpd"); btn.disabled = true;
    try {
      const r = await fetch(RAW + "?t=" + Date.now(), {cache:"no-store"});
      if(!r.ok) throw new Error("fetch failed " + r.status);
      swapIn(await r.text()); LAST_PULL_FAILED = false;
    } catch(e) { LAST_PULL_FAILED = true; }
    finally { btn.disabled = false; renderUpd(DATA_ALL[CUR]); }
  }
  window.__pullLatest = pullLatest;
  $("gUpd").onclick = pullLatest;
  setInterval(() => { if(!document.hidden) pullLatest(); }, 5 * 60 * 1000);
})();

renderAll();
let _rt = null;
window.addEventListener("resize", () => { clearTimeout(_rt); _rt = setTimeout(renderAll, 200); });
</script>
